[package]
name = "dice_roller_discord"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.10"
serenity = { version = "0.12.5", features = ["client", "gateway", "model", "rustls_backend", "cache"] }
tokio = { version = "1.52.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.9.4"
lazy_static = "1.5.0"
regex = "1.12.3"
rusqlite = { version = "0.39.0", features = ["bundled", "uuid"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"
dotenv = "0.15.0"
weighted_rand = "0.4.2"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
once_cell = "1.21.4"
chrono = "0.4.45"
base64 = "0.23.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
